<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="RouteCommand logistics command platform" />
    <title>RouteCommand</title>
    <script>
      try {
        const saved = localStorage.getItem('routecommand-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? `routecommand-${saved}`
            : prefersDark
              ? 'routecommand-dark'
              : 'routecommand-light'
      } catch {
        document.documentElement.dataset.theme = 'routecommand-dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
